services:
  worker:
    build:
      context: .
      dockerfile: services/geo-worker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost:3000
      TEMP_TTL_MINUTES: 30
  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - worker
